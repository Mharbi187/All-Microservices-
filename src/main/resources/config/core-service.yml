# Centralized config for core-service (MS1)
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/nexusaiddb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2.0
        default-requeue-rejected: false

security:
  jwt:
    expiration: ${JWT_EXPIRATION:86400000}

jwt:
  private:
    key: ${JWT_PRIVATE_KEY:}
    key-path: ${JWT_PRIVATE_KEY_PATH:}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

# Cloudinary Configuration (Cloudinary API Credentials)
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
