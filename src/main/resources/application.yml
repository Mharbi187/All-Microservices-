spring:
  application:
    name: core-service
  config:
    import: optional:configserver:http://config-server:8888

  mail:
    host: smtp.gmail.com
    port: 587
    username: c6287943@gmail.com
    password: lqdgldnjygchljia
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  datasource:
    # ⚠️ SECURITY: All datasource credentials must come from environment variables
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/nexusaid_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2.0
        default-requeue-rejected: false

# ─── JWT Configuration (SECURED) ─────────────────────────
security:
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    expiration: 1800000          # 30 minutes (access token)
    refresh-expiration: 604800000 # 7 days (refresh token)

# ─── reCAPTCHA Configuration ─────────────────────────────
recaptcha:
  site-key: ${RECAPTCHA_SITE_KEY:6Leh78ssAAAAACgk1A_-8aPHU_2m58o4dtrlad3U}
  secret-key: ${RECAPTCHA_SECRET_KEY:}
  enabled: ${RECAPTCHA_ENABLED:true}
  score-threshold: 0.5

server:
  port: 8080
  shutdown: graceful

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.75,0.90,0.95,0.99
    tags:
      application: core-service
      environment: production
  info:
    env:
      enabled: true

info:
  app:
    name: NexusAid Core Service
    description: Module 1 - Gestion Sociale et des Ressources
    version: 1.0.0

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

# OpenRouter AI Configuration
openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  api-url: https://openrouter.ai/api/v1/chat/completions
  model: meta-llama/llama-3.1-8b-instruct:free


# Auth Debug Logging (set to WARN in production)
logging:
  level:
    org.springframework.security: INFO
    com.nexusaid.core.security: INFO
    com.nexusaid.core.service.SecurityAuditService: DEBUG
    com.nexusaid.core.service.LoginAttemptService: INFO
    com.nexusaid.core.service.AnomalyDetectionService: INFO
