server:
  port: 8060

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  config:
    import: optional:configserver:http://config-server:8888
  cloud:
    gateway:
      # Automatic route discovery via Eureka
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # Explicit route definitions for precise control
      routes:
        # MS1 - Core Service (Module 1: Social & Resources)
        - id: core-auth
          uri: lb://core-service
          predicates:
            - Path=/api/v1/auth/**

        - id: core-profiles
          uri: lb://core-service
          predicates:
            - Path=/api/v1/profiles/**

        - id: core-committees
          uri: lb://core-service
          predicates:
            - Path=/api/v1/management/committees/**

        - id: core-management
          uri: lb://core-service
          predicates:
            - Path=/api/v1/management/**

        - id: core-inventory
          uri: lb://core-service
          predicates:
            - Path=/api/v1/inventory/**

        - id: core-interventions
          uri: lb://core-service
          predicates:
            - Path=/api/v1/interventions/**

        - id: core-badges
          uri: lb://core-service
          predicates:
            - Path=/api/v1/badges/**

        - id: core-complaints
          uri: lb://core-service
          predicates:
            - Path=/api/v1/profiles/complaints/**

        - id: core-stock-alerts
          uri: lb://core-service
          predicates:
            - Path=/api/v1/inventory/alerts/**

        - id: core-reports
          uri: lb://core-service
          predicates:
            - Path=/api/v1/reports/**

        - id: core-jeunesse
          uri: lb://core-service
          predicates:
            - Path=/api/v1/jeunesse/**

        - id: core-sante
          uri: lb://core-service
          predicates:
            - Path=/api/v1/sante/**

        - id: core-social
          uri: lb://core-service
          predicates:
            - Path=/api/v1/social/**

        - id: core-vff
          uri: lb://core-service
          predicates:
            - Path=/api/v1/vff/**

        - id: core-immigration
          uri: lb://core-service
          predicates:
            - Path=/api/v1/immigration/**

        - id: core-diffusion
          uri: lb://core-service
          predicates:
            - Path=/api/v1/diffusion/**

        - id: core-secourisme
          uri: lb://core-service
          predicates:
            - Path=/api/v1/secourisme/**

        - id: core-sync
          uri: lb://core-service
          predicates:
            - Path=/api/v1/sync/**

        # MS3 - Admin Service (Module 3: Admin, Reporting, Donations)
        - id: admin-templates
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/templates/**

        - id: admin-reports
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/reports/**

        - id: admin-donations
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/donations/**

        - id: admin-monthly-reports
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/monthly-reports/**
          filters:
            - RewritePath=/api/v1/admin/monthly-reports/(?<path>.*), /api/v1/reports/${path}

        - id: admin-dashboard
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/dashboard/**

        - id: admin-events
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/events/**

        # MS4 - Disaster Detection (Module 4: Catastrophes) — REST API
        - id: disaster-api
          uri: ${DISASTER_DETECTION_URL:http://disaster-detection:8000}
          predicates:
            - Path=/api/v1/disasters/**, /api/v1/radar, /api/v1/crisis-room/**, /api/v1/teams/**, /api/v1/logistics/**

        # WebSocket for real-time disaster data
        - id: disaster-ws
          uri: ${DISASTER_DETECTION_WS_URL:ws://disaster-detection:8000}
          predicates:
            - Path=/ws/**

        # Swagger UI Aggregation - Core Service
        - id: core-swagger
          uri: lb://core-service
          predicates:
            - Path=/core/v3/api-docs/**
          filters:
            - RewritePath=/core/(?<path>.*), /${path}

        # Swagger UI Aggregation - Admin Service
        - id: admin-swagger
          uri: lb://admin-service
          predicates:
            - Path=/admin/v3/api-docs/**
          filters:
            - RewritePath=/admin/(?<path>.*), /${path}

        # Unified NexusAid Dashboard (Static/Vite)
        # Catch-all for UI routes not starting with /api, /ws, /core, or /admin
        - id: main-frontend
          uri: ${FRONTEND_URL:http://frontend:80}
          predicates:
            - Path=/, /**
          filters:
            - SetResponseHeader=X-Frame-Options, SAMEORIGIN

      # Default filters applied to all routes
      default-filters:
        - name: RequestRateLimiter
          args:
            rate-limiter: "#{@defaultRateLimiter}"
            key-resolver: "#{@ipKeyResolver}"
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # Global CORS configuration — parameterized for security
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
            allowCredentials: true
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

# Resilience4j Circuit Breaker defaults
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 5
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s

logging:
  level:
    org.springframework.cloud.gateway: INFO

springdoc:
  swagger-ui:
    urls:
      - name: Core Service (Social & Resources)
        url: /core/v3/api-docs
      - name: Admin Service (Reporting & Donations)
        url: /admin/v3/api-docs
  api-docs:
    enabled: true
