server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: admin-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/nexusaid_admin}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 4
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  public-key: ${JWT_PUBLIC_KEY:}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:}
  expiration: ${JWT_EXPIRATION:86400000}

core:
  service:
    # ⚠️ Use Eureka service discovery instead of hard-coded URL
    # Fallback for dev only (when Eureka unavailable)
    url: ${CORE_SERVICE_URL:http://core-service:8080}

aes:
  master:
    key: ${AES_MASTER_KEY}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:admin-files}

pdf-service:
  url: ${PDF_SERVICE_URL:http://pdf-service:3001}
  engine: ${PDF_ENGINE:puppeteer}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: NexusAid Admin Service
    description: Module 3 - Administration, Reporting et Donations
    version: 1.0.0

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
