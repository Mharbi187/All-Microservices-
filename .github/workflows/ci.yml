name: CI — Lint & Test

on:
  push:
    branches: [disaster-detection, main]
  pull_request:
    branches: [disaster-detection, main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Secret scan (tracked files)
        run: bash scripts/secret_scan.sh

      - name: Run tests with coverage
        env:
          # Dummy values so config.py loads without errors
          GEE_SERVICE_ACCOUNT: "ci-dummy@example.iam.gserviceaccount.com"
          GEE_PRIVATE_KEY_PATH: "/dev/null"
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_data.py \
            --ignore=tests/test_live_extraction.py \
            -v --tb=short \
            --cov=src --cov-report=term-missing \
            --cov-report=html:htmlcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "Distaster Detection/htmlcov"
          retention-days: 14

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: "."
          push: true
          tags: |
            ghcr.io/mharbi187/all-microservices/disaster-detection:latest
            ghcr.io/mharbi187/all-microservices/disaster-detection:${{ github.sha }}
