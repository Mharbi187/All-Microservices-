# Centralized config for api-gateway
server:
  port: 8060

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # MS1 - Core Service (Module 1: Social & Resources)
        # Auth routes with strict rate limiting (anti brute-force)
        - id: core-auth
          uri: lb://core-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@authRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"
                deny-empty-key: false

        - id: core-profiles
          uri: lb://core-service
          predicates:
            - Path=/api/v1/profiles/**

        - id: core-committees
          uri: lb://core-service
          predicates:
            - Path=/api/v1/management/committees/**

        - id: core-management
          uri: lb://core-service
          predicates:
            - Path=/api/v1/management/**

        - id: core-inventory
          uri: lb://core-service
          predicates:
            - Path=/api/v1/inventory/**

        - id: core-interventions
          uri: lb://core-service
          predicates:
            - Path=/api/v1/interventions/**

        - id: core-badges
          uri: lb://core-service
          predicates:
            - Path=/api/v1/badges/**

        - id: core-complaints
          uri: lb://core-service
          predicates:
            - Path=/api/v1/complaints/**

        - id: core-stock-alerts
          uri: lb://core-service
          predicates:
            - Path=/api/v1/inventory/alerts/**

        - id: core-reports
          uri: lb://core-service
          predicates:
            - Path=/api/v1/reports/**

        - id: core-jeunesse
          uri: lb://core-service
          predicates:
            - Path=/api/v1/jeunesse/**

        - id: core-sante
          uri: lb://core-service
          predicates:
            - Path=/api/v1/sante/**

        - id: core-social
          uri: lb://core-service
          predicates:
            - Path=/api/v1/social/**

        - id: core-vff
          uri: lb://core-service
          predicates:
            - Path=/api/v1/vff/**

        - id: core-immigration
          uri: lb://core-service
          predicates:
            - Path=/api/v1/immigration/**

        - id: core-diffusion
          uri: lb://core-service
          predicates:
            - Path=/api/v1/diffusion/**

        - id: core-secourisme
          uri: lb://core-service
          predicates:
            - Path=/api/v1/secourisme/**

        - id: core-catastrophe
          uri: lb://core-service
          predicates:
            - Path=/api/v1/catastrophe/**

        - id: core-sync
          uri: lb://core-service
          predicates:
            - Path=/api/v1/sync/**

        - id: core-news
          uri: lb://core-service
          predicates:
            - Path=/api/v1/news/**

        - id: core-events
          uri: lb://core-service
          predicates:
            - Path=/api/v1/events/**

        - id: core-quizzes
          uri: lb://core-service
          predicates:
            - Path=/api/v1/quizzes/**

        - id: core-security
          uri: lb://core-service
          predicates:
            - Path=/api/v1/security/**

        - id: core-onboarding
          uri: lb://core-service
          predicates:
            - Path=/api/v1/onboarding/**

        - id: core-donations
          uri: lb://core-service
          predicates:
            - Path=/api/v1/donations/**

        - id: core-notifications
          uri: lb://core-service
          predicates:
            - Path=/api/v1/notifications/**

        - id: core-homepage-config
          uri: lb://core-service
          predicates:
            - Path=/api/v1/homepage/config,/api/v1/homepage/config/**

        # MS3 - Admin Service (Module 3: Admin, Reporting, Donations)
        - id: admin-templates
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/templates/**

        - id: admin-signatures
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/signatures/**

        - id: admin-reports
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/reports/**

        - id: admin-donations
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/donations/**

        - id: admin-monthly-reports
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/monthly-reports/**
          filters:
            - RewritePath=/api/v1/admin/monthly-reports/(?<segment>.*), /api/v1/reports/$\{segment}

        - id: admin-dashboard
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/dashboard/**

        - id: admin-event-logs
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/event-logs/**
          filters:
            - RewritePath=/api/v1/admin/event-logs/(?<segment>.*), /api/v1/events/$\{segment}

        # (Events & News are routed to core-service above)

        # MS4 - Disaster Detection (REST)
        - id: disaster-simulation
          uri: ${DISASTER_DETECTION_URL:http://disaster-detection:8000}
          predicates:
            - Path=/api/v1/simulation/**

        - id: disaster-api
          uri: ${DISASTER_DETECTION_URL:http://disaster-detection:8000}
          predicates:
            - Path=/api/v1/disasters/**,/api/v1/radar,/api/v1/crisis-room/**,/api/v1/teams/**,/api/v1/logistics/**

        # CPR Assistant - REST API (Health & Session Management)
        # Uses direct container URL to avoid Eureka registration race condition
        - id: cpr-assistant-api
          uri: http://cpr-assistant:8000
          predicates:
            - Path=/api/health,/api/session/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}

        # CPR Assistant WebSocket
        - id: cpr-assistant-ws
          uri: ${CPR_ASSISTANT_WS_URL:ws://cpr-assistant:8000}
          predicates:
            - Path=/ws/session/**

        # Disaster Detection WebSocket
        - id: disaster-ws
          uri: ${DISASTER_DETECTION_WS_URL:ws://disaster-detection:8000}
          predicates:
            - Path=/ws/crisis/**

        # Unified Frontend — all SPA pages + public static assets
        - id: main-frontend
          uri: ${FRONTEND_URL:http://nexus-aid-frontend:80}
          predicates:
            - Path=/,/index.html,/assets/**,/favicon**,/static/**,/manifest.json,/robots.txt,/logo.jpg,/logos/**,/images/**,/*.png,/*.jpg,/*.ico,/*.svg,/*.webp,/login,/register,/forgot-password,/reset-password,/dashboard/**,/volunteers/**,/volunteers,/committees/**,/committees,/settings,/donations,/stocks,/secourisme,/diffusion,/jeunesse,/sante,/social,/immigration,/vff,/catastrophes,/radar,/reporting/**,/volunteer/**,/validation-queue,/audit-logs
          filters:
            - SetResponseHeader=X-Frame-Options, SAMEORIGIN

      default-filters:
        - name: RequestRateLimiter
          args:
            rate-limiter: "#{@defaultRateLimiter}"
            key-resolver: "#{@ipKeyResolver}"
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://192.168.*.*:*"
              - "http://10.*.*.*:*"
              - "http://172.*.*.*:*"
              - ${ALLOWED_ORIGINS:http://localhost:5173}
            allowCredentials: true
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
