# ==============================================================
#  NEXUS-AID — Full Microservices Architecture
#  Orchestration: GitHub Container Registry (GHCR) pre-built images
# ==============================================================

services:
  eureka-server:
    image: ghcr.io/mharbi187/all-microservices/eureka-server:latest
    container_name: nexusaid-eureka
    ports:
      - "8761:8761"
    networks:
      - nexusaid-network

  config-server:
    image: ghcr.io/mharbi187/all-microservices/config-server:latest
    container_name: nexusaid-config
    ports:
      - "8888:8888"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - nexusaid-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexusaid-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - nexusaid-network

  postgres:
    image: postgres:15-alpine
    container_name: nexusaid-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=nexusaiddb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - nexusaid-network



  minio:
    image: minio/minio
    container_name: nexusaid-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    networks:
      - nexusaid-network

  core-service:
    image: ghcr.io/mharbi187/all-microservices/core-service:latest
    container_name: nexusaid-core
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=core-service
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nexusaiddb
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - eureka-server
      - config-server
      - rabbitmq
    networks:
      - nexusaid-network

  admin-service:
    image: ghcr.io/mharbi187/all-microservices/admin-service:latest
    container_name: nexusaid-admin
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=admin-service
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nexusaid_admin
      - CORE_SERVICE_URL=http://core-service:8080
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
      - config-server
    networks:
      - nexusaid-network

  disaster-detection:
    image: ghcr.io/mharbi187/all-microservices/disaster-detection:latest
    container_name: nexusaid-disaster-detection
    ports:
      - "8000:8000"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - CORE_SERVICE_URL=http://core-service:8080
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_PUBLIC_KEY_FILE=${JWT_PUBLIC_KEY_PATH}
    depends_on:
      - rabbitmq
    networks:
      - nexusaid-network
    volumes:
      - disaster-cache:/app/data/cache

  disaster-daemon:
    image: ghcr.io/mharbi187/all-microservices/disaster-detection:latest
    container_name: nexusaid-disaster-daemon
    command: ["python", "-m", "src.daemon"]
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - CORE_SERVICE_URL=http://core-service:8080
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_PUBLIC_KEY_FILE=${JWT_PUBLIC_KEY_PATH}
    depends_on:
      - rabbitmq
      - disaster-detection
    networks:
      - nexusaid-network
    volumes:
      - disaster-cache:/app/data/cache

  api-gateway:
    image: ghcr.io/mharbi187/all-microservices/api-gateway:latest
    container_name: nexusaid-gateway
    ports:
      - "8060:8060"
    environment:
      - SPRING_APPLICATION_NAME=api-gateway
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DISASTER_DETECTION_URL=http://disaster-detection:8000
      - DISASTER_DETECTION_WS_URL=ws://disaster-detection:8000
      - CPR_BACKEND_URL=http://nexus-aid-cpr:8000
      - CPR_BACKEND_WS_URL=ws://nexus-aid-cpr:8000
      - FRONTEND_URL=http://nexus-aid-frontend:80
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_PUBLIC_KEY_PATH=${JWT_PUBLIC_KEY_PATH}
    depends_on:
      - eureka-server
      - config-server
      - core-service
      - admin-service
      - nexus-aid-cpr
    networks:
      - nexusaid-network

  nexus-aid-cpr:
    build:
      context: ./app-mobile
      dockerfile: Dockerfile
    container_name: nexusaid-cpr
    ports:
      - "8005:8000"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
    depends_on:
      - eureka-server
      - config-server
    networks:
      - nexusaid-network

  nexus-aid-frontend:
    image: ghcr.io/mharbi187/all-microservices/nexus-aid-frontend:latest
    container_name: nexusaid-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - disaster-detection
    networks:
      - nexusaid-network

networks:
  nexusaid-network:
    driver: bridge

volumes:
  disaster-cache:
