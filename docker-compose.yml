# ==============================================================
#  NEXUS-AID — Full Microservices Architecture
#  Orchestration: GitHub Container Registry (GHCR) pre-built images
# ==============================================================

services:
  eureka-server:
    build: ../eureka-server
    container_name: nexusaid-eureka
    restart: always
    ports:
      - "8761:8761"
    networks:
      - nexusaid-network

  config-server:
    build: ../config-server
    container_name: nexusaid-config
    restart: always
    ports:
      - "8888:8888"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - nexusaid-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexusaid-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - nexusaid-network

  redis:
    image: redis:7-alpine
    container_name: nexusaid-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - nexusaid-network

  postgres:
    image: postgres:15-alpine
    container_name: nexusaid-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=nexusaiddb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ../postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - nexusaid-network



  minio:
    image: minio/minio
    container_name: nexusaid-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    networks:
      - nexusaid-network

  core-service:
    build: ../core-service
    container_name: nexusaid-core
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=core-service
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nexusaiddb
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - RECAPTCHA_ENABLED=${RECAPTCHA_ENABLED}
    depends_on:
      - postgres
      - eureka-server
      - config-server
      - rabbitmq
    networks:
      - nexusaid-network

  admin-service:
    build: ../admin-service
    container_name: nexusaid-admin
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=admin-service
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nexusaid_admin
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS}
      - CORE_SERVICE_URL=http://core-service:8080
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - AES_MASTER_KEY=${AES_MASTER_KEY}
    depends_on:
      - postgres
      - rabbitmq
      - eureka-server
      - config-server
    networks:
      - nexusaid-network

  disaster-detection:
    build: ../disaster-detection
    container_name: nexusaid-disaster-detection
    restart: always
    ports:
      - "8000:8000"
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - CORE_SERVICE_URL=http://core-service:8080
      - ALLOWED_ORIGINS=https://nexus-aid.me,https://www.nexus-aid.me
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_PUBLIC_KEY_FILE=${JWT_PUBLIC_KEY_PATH}
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - DATABASE_URL=postgresql://${SPRING_DATASOURCE_USERNAME}:${SPRING_DATASOURCE_PASSWORD}@postgres:5432/nexusaiddb
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM}
      - GEE_SERVICE_ACCOUNT=${GEE_SERVICE_ACCOUNT}
    depends_on:
      - rabbitmq
      - eureka-server
      - postgres
    networks:
      - nexusaid-network
    volumes:
      - disaster-cache:/app/data/cache
      - ../disaster-detection/detection-478419-fa67745b4754.json:/app/security/detection-478419-fa67745b4754.json:ro

  disaster-daemon:
    build: ../disaster-detection
    container_name: nexusaid-disaster-daemon
    restart: always
    healthcheck:
      disable: true
    command: ["python", "-m", "src.daemon"]
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - CORE_SERVICE_URL=http://core-service:8080
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_PUBLIC_KEY_FILE=${JWT_PUBLIC_KEY_PATH}
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - DATABASE_URL=postgresql://${SPRING_DATASOURCE_USERNAME}:${SPRING_DATASOURCE_PASSWORD}@postgres:5432/nexusaiddb
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM}
      - GEE_SERVICE_ACCOUNT=${GEE_SERVICE_ACCOUNT}
    depends_on:
      - rabbitmq
      - disaster-detection
      - eureka-server
      - postgres
    networks:
      - nexusaid-network
    volumes:
      - disaster-cache:/app/data/cache
      - ../disaster-detection/detection-478419-fa67745b4754.json:/app/security/detection-478419-fa67745b4754.json:ro

  pdf-service:
    build: ../pdf-service-branch
    container_name: nexusaid-pdf-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/apps/
    depends_on:
      - eureka-server
    networks:
      - nexusaid-network

  cpr-assistant:
    build: ../app-mobile
    container_name: nexusaid-cpr-assistant
    restart: always
    ports:
      - "8002:8000"
    environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
    depends_on:
      - eureka-server
    networks:
      - nexusaid-network

  api-gateway:
    build: ../api-gateway
    container_name: nexusaid-gateway
    restart: always
    ports:
      - "8060:8060"
    environment:
      - SPRING_APPLICATION_NAME=api-gateway
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DISASTER_DETECTION_URL=http://disaster-detection:8000
      - DISASTER_DETECTION_WS_URL=ws://disaster-detection:8000
      - FRONTEND_URL=http://nexus-aid-frontend:80
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - JWT_PUBLIC_KEY_PATH=${JWT_PUBLIC_KEY_PATH}
      - ALLOWED_ORIGINS=https://nexus-aid.me,https://www.nexus-aid.me
    depends_on:
      - eureka-server
      - config-server
      - core-service
      - admin-service
    networks:
      - nexusaid-network

  nexus-aid-frontend:
    build: ../nexus-aid-frontend
    container_name: nexusaid-frontend
    restart: always

    depends_on:
      - api-gateway
      - disaster-detection
    networks:
      - nexusaid-network

  caddy:
    image: caddy:2-alpine
    container_name: nexusaid-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - nexusaid-network

networks:
  nexusaid-network:
    driver: bridge

volumes:
  disaster-cache:
  caddy_data:
  caddy_config:
