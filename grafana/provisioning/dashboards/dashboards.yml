apiVersion: 1

providers:
  - name: 'NexusAid Dashboards'
    orgId: 1
    folder: 'NexusAid'
    folderUid: 'nexusaid'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
