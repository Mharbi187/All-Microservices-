#################################### Server ####################################
[server]
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

#################################### Database ####################################
[database]
type = sqlite3
path = grafana.db

#################################### Security ####################################
[security]
admin_user = admin
secret_key = NexusAidGrafanaSecretKey2026
disable_gravatar = false
allow_embedding = false
cookie_secure = false
cookie_samesite = lax

#################################### Users ####################################
[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_id = 1
auto_assign_org_role = Viewer
default_theme = dark

#################################### Auth ####################################
[auth]
disable_login_form = false
disable_signout_menu = false

[auth.anonymous]
enabled = false

#################################### SMTP ####################################
[smtp]
enabled = true
host = smtp.gmail.com:587
user = c6287943@gmail.com
password = lqdgldnjygchljia
cert_file =
key_file =
skip_verify = false
from_address = c6287943@gmail.com
from_name = NexusAid Monitoring
startTLS_policy = MandatoryStartTLS

#################################### Alerting ####################################
[alerting]
enabled = false

[unified_alerting]
enabled = true

#################################### Logging ####################################
[log]
mode = console
level = info

#################################### Feature Toggles ####################################
[feature_toggles]
enable = ngalert

#################################### Panels ####################################
[panels]
disable_sanitize_html = false

#################################### Analytics ####################################
[analytics]
reporting_enabled = false
check_for_updates = false
